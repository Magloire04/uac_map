name: CI

on:
  pull_request:
    branches: [main, develop]
    # « edited » relance la CI quand la base d'une PR empilée passe sur develop.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-et-tests:
    name: lint-et-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linter (règles de sécurité en erreur)
        run: npm run lint
      - name: Formatage
        run: npm run format:check
      - name: Tests
        run: npm test

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conventional Commits, sans signature automatique
        run: |
          status=0
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > /tmp/message
            if ! scripts/ci/checkCommitMessage.sh /tmp/message; then
              echo "::error::Commit $sha non conforme"
              status=1
            fi
          done
          exit $status
      - name: Titre de la PR au format [UAC-numéro]
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! [[ "$PULL_REQUEST_TITLE" =~ ^\[UAC-[0-9]+\]\ .{1,52}$ ]]; then
            echo "::error::Titre attendu : [UAC-12] Description courte (60 caractères au maximum)"
            exit 1
          fi
